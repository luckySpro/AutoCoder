[package]
name = "autocoder-desktop"
version = "0.0.0"
description = "AutoCoder 桌面外壳：窗口、菜单栏图标、后台运行，内置 Go 引擎"
authors = ["M&J Group <473276@qq.com>"]
repository = "https://github.com/luckySpro/AutoCoder"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "autocoder-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
