name: Release

# 推送 v* 标签时发布；也可以在 Actions 页面手动运行，只上传构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # 命令行版（无图标，纯 Go）全平台交叉编译；Linux、Windows 桌面版也不需要 CGO，一起编
  cross:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建
        run: |
          node scripts/sync-web.mjs
          VERSION=$(git describe --tags --always)
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-cli-$os-$arch$ext ./cmd/autocoder
          done
          for t in linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-desktop-$os-$arch ./cmd/autocoder
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-desktop-windows-$arch.exe ./cmd/autocoder
          done
          cd out && sha256sum * > SHA256SUMS-cross.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: out/*

  # macOS 菜单栏图标要用系统接口（CGO），只能在 macOS 上编译
  macos:
    needs: web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建 AutoCoder.app（Intel 和 Apple 芯片通用）
        run: |
          node scripts/sync-web.mjs
          VERSION=$(git describe --tags --always)
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o build/autocoder-$arch ./cmd/autocoder
          done
          lipo -create -output build/autocoder build/autocoder-amd64 build/autocoder-arm64
          mkdir -p out
          scripts/macapp.sh build/autocoder "$VERSION" build
          # 没有开发者证书：做一次临时签名，首次打开需要右键「打开」
          codesign --force --deep -s - build/AutoCoder.app
          ditto -c -k --keepParent build/AutoCoder.app out/AutoCoder-macos-universal.zip
          cd out && shasum -a 256 * > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --generate-notes
