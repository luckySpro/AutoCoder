name: Release

# 推送 v* 标签时发布；也可以在 Actions 页面手动运行：填版本号（如 v0.1.0）就从当前提交创建标签并发布，留空只上传构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v0.1.0；留空只构建不发布'
        required: false
        default: ''

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # 命令行版（无图标，纯 Go）全平台交叉编译；Linux、Windows 桌面版也不需要 CGO，一起编
  cross:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建
        run: |
          node scripts/sync-web.mjs
          case "$VERSION" in v*) ;; *) VERSION=$(git rev-parse --short HEAD);; esac
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-cli-$os-$arch$ext ./cmd/autocoder
          done
          for t in linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-desktop-$os-$arch ./cmd/autocoder
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-desktop-windows-$arch.exe ./cmd/autocoder
          done
          cd out && sha256sum * > SHA256SUMS-cross.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: out/*

  # macOS 菜单栏图标要用系统接口（CGO），只能在 macOS 上编译
  macos:
    needs: web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建 AutoCoder.app（Intel 和 Apple 芯片通用）
        run: |
          node scripts/sync-web.mjs
          case "$VERSION" in v*) ;; *) VERSION=$(git rev-parse --short HEAD);; esac
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build -tags tray -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o build/autocoder-$arch ./cmd/autocoder
          done
          lipo -create -output build/autocoder build/autocoder-amd64 build/autocoder-arm64
          mkdir -p out
          scripts/macapp.sh build/autocoder "$VERSION" build
          # 没有开发者证书：做一次临时签名，首次打开需要右键「打开」
          codesign --force --deep -s - build/AutoCoder.app
          ditto -c -k --keepParent build/AutoCoder.app out/AutoCoder-macos-universal.zip
          cd out && shasum -a 256 * > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  release:
    if: startsWith(github.event.inputs.version || github.ref_name, 'v')
    needs: [cross, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{cross,macos}'
          path: out
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find out -maxdepth 1 -type f | sort)
          # 重跑时发布已存在：只补传并覆盖产物
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AutoCoder $VERSION" --generate-notes
          fi
