name: Release

# 推送 v* 标签时发布；也可以在 Actions 页面手动运行：填版本号（如 v0.1.0）就从当前提交创建标签并发布，留空只上传构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v0.1.0；留空只构建不发布'
        required: false
        default: ''

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # 命令行版单文件（纯 Go）全平台交叉编译；同一个文件也是桌面版里的内置引擎
  cli:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建
        run: |
          node scripts/sync-web.mjs
          case "$VERSION" in v*) ;; *) VERSION=$(git rev-parse --short HEAD);; esac
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o out/autocoder-cli-$os-$arch$ext ./cmd/autocoder
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*

  # 桌面版：Rust + Tauri 2 外壳，内置上面的 Go 引擎；在各自的系统上构建和封装
  desktop:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, engine: darwin-arm64, bundles: 'app,dmg' }
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin, engine: darwin-amd64, bundles: 'app,dmg' }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, engine: windows-amd64.exe, bundles: 'nsis,msi' }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, engine: linux-amd64, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - name: 放入内置引擎
        run: |
          ext=; case "${{ matrix.target }}" in *windows*) ext=.exe;; esac
          cp cli/autocoder-cli-${{ matrix.engine }} desktop/src-tauri/binaries/autocoder-engine-${{ matrix.target }}$ext
          chmod +x desktop/src-tauri/binaries/*
      - name: 构建安装包
        run: |
          case "$VERSION" in v*) ver=${VERSION#v};; *) ver=0.0.0;; esac
          cd desktop
          npm ci
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"version\":\"$ver\"}"
      - name: 收集产物
        run: |
          b=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          find $b -maxdepth 2 \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -type f -exec cp {} out/ \;
          ls -l out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.event.inputs.version || github.ref_name, 'v')
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{cli,desktop-*}'
          path: out
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          files=$(find out -maxdepth 1 -type f | sort)
          # 重跑时发布已存在：只补传并覆盖产物
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AutoCoder $VERSION" --generate-notes
          fi
