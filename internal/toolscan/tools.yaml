# AutoCoder 默认开发工具清单
# 只收录命令行（CLI）工具，统一由 AutoCoder 派发和计量。启动时按此清单检测本机已安装的工具。用户可在 ~/.autocoder/tools.yaml 覆盖或追加条目（按 id 合并）。
#
# 字段说明：
#   id          唯一标识
#   name        显示名称
#   vendor      厂商
#   commands    依次尝试的可执行文件名（在 PATH 中查找）
#   paths       额外的绝对路径候选（按操作系统区分：darwin/linux/windows），支持 ~ 展开
#   version_args 获取版本号的参数
#   headless    非交互调用模板，{prompt} 会被替换为任务说明；没有模板的工具不参与调度
#   usage_args  追加到 headless 后、让工具输出含 token 用量的结构化结果的参数；为空时按字符数估算
#   auto_args   无人值守参数：免确认、限定在工作目录内修改
#   stream_args 输出事件流的参数（用于实时查看过程）；设置后代替 usage_args
#   full_args   最高权限参数：直接执行命令、联网、不再询问；默认使用，
#               在工具清单里把权限改成「只改文件」（access: standard）时改用 auto_args
#   help_args   输出帮助文本的参数，用来核对当前版本是否还认识上面的参数
#   readonly_args 只读模式参数，用于规划和评审
#   auth_errors / limit_errors  输出中表示"未登录"/"限流或额度用完"的关键字（不区分大小写）
#   以上参数随工具版本变化，默认值按常见版本填写，可在界面「工具清单」里直接修改。
#   capability  综合能力评分（0-100），用于挑选"最聪明"的工具担任架构/项目管理
#   strengths   擅长方向：architecture / coding / frontend / testing / review

tools:
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    commands: [claude]
    version_args: ["--version"]
    help_args: ["--help"]
    headless: ["-p", "{prompt}"]
    usage_args: ["--output-format", "json"]
    auto_args: ["--permission-mode", "acceptEdits"]
    full_args: ["--permission-mode", "bypassPermissions"]
    stream_args: ["--output-format", "stream-json", "--verbose"]
    readonly_args: ["--permission-mode", "plan"]
    auth_errors: ["not logged in", "please run /login", "invalid api key", "failed to authenticate", "oauth session expired", "oauth token has expired", "authentication_error"]
    limit_errors: ["usage limit", "rate limit", "429"]
    capability: 95
    strengths: [architecture, coding, review, testing]

  - id: codex
    name: Codex CLI
    vendor: OpenAI
    commands: [codex]
    version_args: ["--version"]
    help_args: ["exec", "--help"]
    headless: ["exec", "{prompt}"]
    usage_args: ["--json"]
    auto_args: ["--sandbox", "workspace-write"]
    full_args: ["--dangerously-bypass-approvals-and-sandbox"]
    readonly_args: ["--sandbox", "read-only"]
    auth_errors: ["not logged in", "please login", "401 unauthorized"]
    limit_errors: ["rate limit", "usage limit", "429"]
    capability: 90
    strengths: [coding, architecture, testing]

  - id: cursor-agent
    name: Cursor Agent CLI
    vendor: Anysphere
    commands: [cursor-agent]
    version_args: ["--version"]
    help_args: ["--help"]
    headless: ["-p", "{prompt}"]
    usage_args: ["--output-format", "json"]
    auto_args: ["--force"]
    stream_args: ["--output-format", "stream-json"]
    auth_errors: ["not logged in", "cursor-agent login"]
    limit_errors: ["rate limit", "429"]
    capability: 85
    strengths: [coding, frontend]

  - id: gemini-cli
    name: Gemini CLI
    vendor: Google
    commands: [gemini]
    version_args: ["--version"]
    help_args: ["--help"]
    headless: ["-p", "{prompt}"]
    usage_args: ["--output-format", "json"]
    auto_args: ["--approval-mode", "auto_edit"]
    full_args: ["--approval-mode", "yolo"]
    auth_errors: ["login required", "authentication"]
    limit_errors: ["quota", "rate limit", "429"]
    capability: 85
    strengths: [coding, review, frontend]

  - id: qwen-code
    name: Qwen Code
    vendor: Alibaba
    commands: [qwen]
    version_args: ["--version"]
    help_args: ["--help"]
    headless: ["-p", "{prompt}"]
    usage_args: ["--output-format", "json"]
    auto_args: ["--approval-mode", "auto-edit"]
    full_args: ["--approval-mode", "yolo"]
    auth_errors: ["login required", "authentication"]
    limit_errors: ["quota", "rate limit", "429"]
    capability: 75
    strengths: [coding, testing]

  - id: copilot-cli
    name: GitHub Copilot CLI
    vendor: GitHub
    commands: [copilot]
    version_args: ["--version"]
    help_args: ["--help"]
    headless: ["-p", "{prompt}"]
    auto_args: ["--allow-all-tools"]
    auth_errors: ["not logged in", "/login"]
    limit_errors: ["rate limit", "429"]
    capability: 78
    strengths: [coding, review]

  - id: opencode
    name: OpenCode
    vendor: SST
    commands: [opencode]
    version_args: ["--version"]
    help_args: ["run", "--help"]
    headless: ["run", "{prompt}"]
    limit_errors: ["rate limit", "429"]
    capability: 72
    strengths: [coding, testing]

  - id: aider
    name: Aider
    vendor: Aider
    commands: [aider]
    version_args: ["--version"]
    headless: ["--message", "{prompt}", "--yes-always"]
    limit_errors: ["rate limit", "429"]
    capability: 70
    strengths: [coding, testing]
